<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ArPage</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #E8E8E5;
      }
      body {
        font-family: Georgia, serif;
      }
      .setup {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #111111;
      }
      .panel {
        width: 360px;
        padding: 32px;
        border: 1px solid #CCCCCC;
        border-radius: 12px;
        background: #F4F4F2;
        box-shadow: 4px 4px 0 #BBBBBB;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 28px;
        line-height: 1.1;
      }
      p {
        margin: 0 0 20px;
        color: #777777;
        font-size: 14px;
        font-style: italic;
        line-height: 1.6;
      }
      button {
        height: 40px;
        padding: 0 18px;
        border: 0;
        border-radius: 7px;
        background: #111111;
        color: #E8E8E5;
        cursor: pointer;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <script src="newtab.js"></script>
  </body>
</html>
